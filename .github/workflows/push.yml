name: Push

on: push

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint

  build:
    needs: lint

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
